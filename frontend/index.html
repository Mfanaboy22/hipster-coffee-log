<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Requirement: Dynamic title showing the brew count -->
  <title id="page-title">Brews: 0</title>
  <!-- Bootstrap CSS for instant styling and a responsive mobile grid -->
  <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <!-- Header with Dynamic Heading (Requirement) -->
    <header class="d-flex justify-content-between align-items-center mb-5 pb-3 border-bottom">
      <h1 id="brew-count-heading" class="fw-bold text-dark">Brews: 0</h1>
      <button class="btn btn-primary px-4 fw-semibold shadow-sm" data-bs-toggle="modal" data-bs-target="#brewModal" onclick="clearForm()">
        ☕️ Log New Brew
      </button>
    </header>

    <!-- Filter Control (Requirement: Filter by brew method) -->
    <div class="row mb-4">
      <div class="col-md-4 col-sm-6">
        <label for="filterMethod" class="form-label fw-semibold text-secondary">Filter by Brew Method:</label>
        <select id="filterMethod" class="form-select shadow-sm" onchange="fetchBrews()">
          <option value="">All Methods</option>
          <option value="V60">V60</option>
          <option value="French Press">French Press</option>
          <option value="Espresso">Espresso</option>
          <option value="Aeropress">Aeropress</option>
        </select>
      </div>
    </div>

    <!-- Brew Cards Container (Responsive Grid layout) -->
    <div id="brew-list" class="row g-4"></div>
  </div>

  <!-- Form Modal (Handles both Create and Edit records) -->
  <div class="modal fade" id="brewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="brewForm" onsubmit="saveBrew(event)" class="modal-content shadow">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title" id="modalTitle">Log New Brew</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="brewId">
          
          <!-- Requirement: Frontend Form Validations via 'required' attributes -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Roaster *</label>
            <input type="text" id="roaster" class="form-control" required placeholder="e.g. Father Coffee">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Bean Origin *</label>
            <input type="text" id="beanOrigin" class="form-control" required placeholder="e.g. Ethiopia">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Brew Method *</label>
            <select id="brewMethod" class="form-select" required>
              <option value="V60">V60</option>
              <option value="French Press">French Press</option>
              <option value="Espresso">Espresso</option>
              <option value="Aeropress">Aeropress</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Notes</label>
            <textarea id="notes" class="form-control" rows="3" placeholder="Describe the flavors..."></textarea>
          </div>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success px-4">Save Entry</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts: Bootstrap Bundle and API fetch logic -->
  <script src="https://jsdelivr.net"></script>
  <script>
    // Point this directly to your hosted API once backend deployment is ready
    const API_URL = 'http://localhost:5000/api/brews';
    const modalInstance = new bootstrap.Modal(document.getElementById('brewModal'));

    // 1. READ & FILTER entries
    async function fetchBrews() {
      const selectedMethod = document.getElementById('filterMethod').value;
      const url = selectedMethod ? `${API_URL}?method=${selectedMethod}` : API_URL;
      
      try {
        const response = await fetch(url);
        const brews = await response.json();
        
        // Dynamically update page title count and interface heading text
        document.getElementById('page-title').innerText = `Brews: ${brews.length}`;
        document.getElementById('brew-count-heading').innerText = `Brews: ${brews.length}`;
        
        const listContainer = document.getElementById('brew-list');
        if (brews.length === 0) {
          listContainer.innerHTML = `<div class="col-12 text-center text-muted my-5"><h5>No brews tracked yet!</h5></div>`;
          return;
        }

        listContainer.innerHTML = brews.map(brew => `
          <div class="col-md-4 col-sm-6">
            <div class="card h-100 shadow-sm border-0">
              <div class="card-body d-flex flex-column">
                <span class="badge bg-secondary align-self-start mb-2">${brew.brewMethod}</span>
                <h5 class="card-title fw-bold text-dark mb-1">${brew.roaster}</h5>
                <h6 class="card-subtitle text-muted mb-3">📍 ${brew.beanOrigin}</h6>
                <p class="card-text text-secondary flex-grow-1">${brew.notes ? brew.notes : '<em>No tasting notes added.</em>'}</p>
                <div class="mt-3 pt-2 border-top d-flex justify-content-end gap-2">
                  <button class="btn btn-sm btn-outline-warning fw-medium" onclick="populateEditForm(${JSON.stringify(brew).replace(/"/g, '&quot;')})">Edit</button>
                  <button class="btn btn-sm btn-outline-danger fw-medium" onclick="deleteBrew(${brew.id})">Delete</button>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error("Failed to load data:", err);
      }
    }

    // 2. CREATE & UPDATE entries
    async function saveBrew(event) {
      event.preventDefault();
      
      const id = document.getElementById('brewId').value;
      const payload = {
        roaster: document.getElementById('roaster').value,
        beanOrigin: document.getElementById('beanOrigin').value,
        brewMethod: document.getElementById('brewMethod').value,
        notes: document.getElementById('notes').value
      };

      const requestMethod = id ? 'PUT' : 'POST';
      const endpoint = id ? `${API_URL}/${id}` : API_URL;

      try {
        await fetch(endpoint, {
          method: requestMethod,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        modalInstance.hide();
        fetchBrews();
      } catch (err) {
        alert("Error saving brew information.");
      }
    }

    // 3. DELETE entry
    async function deleteBrew(id) {
      if (confirm("Are you sure you want to delete this brew entry?")) {
        try {
          await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
          fetchBrews();
        } catch (err) {
          alert("Error deleting record.");
        }
      }
    }

    /********** HELPER FUNCTIONS **********/
    function populateEditForm(brew) {
      document.getElementById('modalTitle').innerText = "Edit Brew Entry";
      document.getElementById('brewId').value = brew.id;
      document.getElementById('roaster').value = brew.roaster;
      document.getElementById('beanOrigin').value = brew.beanOrigin;
      document.getElementById('brewMethod').value = brew.brewMethod;
      document.getElementById('notes').value = brew.notes || "";
      modalInstance.show();
    }

    function clearForm() {
      document.getElementById('modalTitle').innerText = "Log New Brew";
      document.getElementById('brewId').value = "";
      document.getElementById('brewForm').reset();
    }

    // Initial query on layout startup
    fetchBrews();
  </script>
</body>
</html>
